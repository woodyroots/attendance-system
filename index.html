<title>نظام التحضير الذكي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F2F2;--surface:#fff;--ink:#111144;--sub:#5d6482;--blue:#4056E3;--cyan:#00AEDA;--green:#0A8E6E;--turquoise:#40E0D0;--green-light:#e6f5f1;--blue-light:#ecefff;--red:#c94646;--red-light:#fff0f0;--amber:#7a6700;--amber-light:#fcf6cc;--border:#e2e7f0;--shadow:0 8px 28px rgba(29,48,110,.07)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'Tajawal',Tahoma,Arial,sans-serif;background:var(--bg);color:#111144}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #9bb0ff;outline-offset:2px}.hidden{display:none!important}
/* Login — restored to the original page layout */
#loginPage{min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;padding:20px;background:#fff;color:var(--blue)}
#loginPage .wrap{width:100%;max-width:420px}
#loginPage header{text-align:center;margin-bottom:28px}#loginPage .logo{display:block;width:100%;max-width:300px;height:auto;margin:0 auto 26px}#loginPage .foot{margin-top:34px;text-align:center;font-size:12px;color:#8390a7}
#loginPage h1{margin:0 0 6px;font-size:28px;color:var(--blue)}
#loginPage header p{margin:0;color:var(--cyan)}
#loginPage .hidden{display:none!important}
#loginPage .roles{display:grid;gap:14px}
#loginPage button{font:inherit;color:inherit;cursor:pointer}
#loginPage .role{padding:18px;border:2px solid var(--green);border-radius:8px;background:#fff;font-size:18px;font-weight:700;text-align:center;color:var(--blue)}
#loginPage .role:hover,#loginPage .role:focus-visible{background:rgba(10,142,110,.1);outline:none}
#loginPage h2{margin:0 0 8px;font-size:20px;color:var(--blue)}
#loginPage label{display:block;margin:16px 0 6px;font-weight:500;color:var(--blue)}
#loginPage .field-wrap{position:relative}
#loginPage input{width:100%;padding:13px 14px;border:2px solid var(--green);border-radius:8px;background:#fff;color:var(--blue);font:inherit;font-size:16px;text-align:left}
#loginPage input::placeholder{color:var(--blue);opacity:.45}
#loginPage input:focus{outline:3px solid rgba(10,142,110,.3)}
#loginPage .eye{position:absolute;left:10px;top:50%;transform:translateY(-50%);background:none;border:0;font-size:14px;text-decoration:underline;color:var(--cyan)}
#loginPage .btn{width:100%;margin-top:22px;padding:14px;border:2px solid var(--green);border-radius:8px;background:var(--green);color:#fff;font-size:17px;font-weight:700}
#loginPage .back{background:none;border:0;padding:0;margin-bottom:14px;text-decoration:underline;color:var(--cyan)}
#loginPage .msg{margin-top:14px;text-align:center;min-height:22px;color:var(--cyan)}
body.app-mode{background:var(--bg);padding:0}
/* App shell */

function stat(title,value,icon,note,color='blue'){return `<div class="stat"><div class="stat-top"><span>${title}</span><span class="stat-icon" style="background:${color==='green'?'var(--green-light)':color==='red'?'var(--red-light)':color==='amber'?'var(--amber-light)':'var(--blue-light)'};color:${color==='green'?'var(--green)':color==='red'?'var(--red)':color==='amber'?'var(--amber)':'var(--blue)'}">${ic(icon)}</span></div><strong>${value}</strong><small>${note}</small></div>`}

function studentStats(courseId){
 const records=state.attendance.filter(a=>a.studentId===getStudent().id&&(!courseId||a.courseId===courseId));
 const absent=records.filter(a=>a.status==='غائب').length, attended=records.filter(a=>a.status==='حاضر').length, excused=records.filter(a=>a.status==='معذور').length;
 const total=records.length;return {records,absent,attended,excused,total,percent:pct(absent)};
}
function absTxt(n){return n===0?'لا غياب':n===1?'غياب واحد':n===2?'غيابان':n<=10?n+' غيابات':n+' غيابًا'}
function pct(n){return +(n/state.semesterLectures*100).toFixed(1)}
function maxAbs(){return Math.floor(state.semesterLectures*state.threshold/100)}
function courseRisk(id){const a=studentStats(id).absent,m=maxAbs();return a>m?'deprived':a===m?'limit':a>=m-2?'warn':'ok'}
function studentCourseCard(course){
 const s=studentStats(course.id);const n=s.percent,m=maxAbs(),r=courseRisk(course.id);const danger=r==='deprived';const warn=r==='limit'||r==='warn';
 return `<div class="course-row"><div class="course-icon">${ic('▤')}</div><div class="course-info"><b>${esc(course.name)}</b><small>${esc(course.id)} · ${esc(course.section)} · ${esc(course.instructor)}</small><div class="bar ${danger?'danger':warn?'warn':''}"><span style="width:${Math.max(2,Math.min(100,Math.round(s.absent/Math.max(1,m)*100)))}%"></span></div></div><div class="percent"><span>${n}%</span><div class="small">${absTxt(s.absent)}</div>${danger?'<span class="badge red">حرمان</span>':''}</div></div>`;
}

 if(!state.alertsEnabled)return '<div class="alert info">التنبيهات غير مفعلة حاليًا.</div>';

function pageSession(){
 if(currentRole==='student')return pageHead('تسجيل الحضور','اختر المقرر وأدخل رمز جلسة التحضير.')+
 `<section class="panel center"><h3>التحقق من جلسة المحاضرة</h3><p class="muted">اختر المقرر ثم أدخل رمز الجلسة الظاهر لدى عضو هيئة التدريس.</p><div class="form-grid" style="text-align:right;max-width:600px;margin:18px auto"><div class="form-field"><label for="studentCourse">المقرر</label><select id="studentCourse" class="field">${state.courses.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}</select></div><div class="form-field"><label for="qrInput">رمز الجلسة</label><input id="qrInput" class="field ltr" placeholder="مثال: 482731"></div></div><button class="primary" data-action="submit-qr">التحقق وتسجيل الحضور</button><p class="small">رمز الجلسة: 482731</p></section>`;
 return pageHead('جلسة التحضير','افتح جلسة للمقرر ثم راجع قائمة الطلاب واحفظ حالاتهم.')+
 `<div class="grid2"><section class="panel"><h3>إعداد الجلسة</h3><div class="form-grid" style="margin-top:16px"><div class="form-field"><label for="sessionCourse">المقرر</label><select class="field" id="sessionCourse">${state.courses.map(c=>`<option value="${esc(c.id)}">${esc(c.name)} (${esc(c.id)})</option>`).join('')}</select></div><div class="form-field"><label for="sessionLecture">رقم المحاضرة</label><input class="field" id="sessionLecture" value="المحاضرة 11"></div></div><div class="form-actions"><button class="primary" data-action="open-session">فتح جلسة التحضير</button></div><div id="sessionMessage" class="muted" style="margin-top:12px">لم تُفتح جلسة بعد.</div></section><section class="panel center"><h3>رمز QR للجلسة</h3><div class="qr-box"><span id="qrCode">482731</span></div><div class="badge amber">رمز الجلسة</div><p class="muted">اعرض الرمز للطلاب لإتمام تسجيل الحضور.</p></section></div>
 <section class="panel"><div class="panel-head"><h3>قائمة الطلاب وحالات الحضور</h3><button class="primary" data-action="save-session">حفظ حالات الحضور</button></div><div class="table-wrap"><table><thead><tr><th>الرقم الجامعي</th><th>اسم الطالب</th><th>البريد</th><th>حالة الحضور</th></tr></thead><tbody id="sessionRoster">${renderRosterRows()}</tbody></table></div></section>`;
}
function renderRosterRows(){return state.students.map(s=>`<tr><td>${esc(s.id)}</td><td>${esc(s.name)}</td><td>${esc(s.email)}</td><td><select class="field roster-status" data-student="${esc(s.id)}" style="padding:7px;max-width:150px"><option>حاضر</option><option>غائب</option><option>معذور</option></select></td></tr>`).join('')}
function pageAlerts(){return pageHead('التنبيهات','مراجعة تنبيهات الغياب وفق السجلات وحد الغياب المحدد.')+`<section class="panel"><div class="panel-head"><h3>حالة المقررات</h3></div>${studentAlertMarkup()}${state.courses.map(c=>`<div class="course-row"><div class="course-icon">${ic('♢')}</div><div class="course-info"><b>${esc(c.name)}</b><small>الغياب: ${absTxt(studentStats(c.id).absent)} (${studentStats(c.id).percent}%)</small></div>${({deprived:'<span class="badge red">حرمان</span>',limit:'<span class="badge amber">على الحد الأقصى</span>',warn:'<span class="badge amber">يتطلب الانتباه</span>',ok:'<span class="badge green">ضمن الحد المسموح</span>'})[courseRisk(c.id)]}</div>`).join('')}</section>`}
function pageReports(){
 const total=state.attendance.length, present=state.attendance.filter(a=>a.status==='حاضر').length, absent=state.attendance.filter(a=>a.status==='غائب').length, excused=state.attendance.filter(a=>a.status==='معذور').length;
 return pageHead('تقارير الحضور والغياب','ملخص الحضور والغياب حسب المقرر مع إمكانية التصدير.',`<button class="primary" data-action="export-report">تصدير CSV</button>`)+
 `<div class="stats">${stat('إجمالي السجلات',total,'▦','كل السجلات')}${stat('حاضر',present,'✓','حالات حضور','green')}${stat('غائب',absent,'!','حالات غياب','red')}${stat('معذور',excused,'◇','حالات بعذر','amber')}</div><section class="panel"><div class="panel-head"><h3>ملخص حسب المقرر</h3></div><div class="table-wrap"><table><thead><tr><th>المقرر</th><th>عدد السجلات</th><th>حاضر</th><th>غائب</th><th>معذور</th></tr></thead><tbody>${state.courses.map(c=>{const a=state.attendance.filter(x=>x.courseId===c.id);return `<tr><td>${esc(c.name)}</td><td>${a.length}</td><td>${a.filter(x=>x.status==='حاضر').length}</td><td>${a.filter(x=>x.status==='غائب').length}</td><td>${a.filter(x=>x.status==='معذور').length}</td></tr>`}).join('')}</tbody></table></div><p class="small">يمكن فتح ملف CSV في برامج الجداول.</p></section>`;
}
function pageManagement(){
 return pageHead('إدارة البيانات','إضافة الطلاب ومراجعة بياناتهم.')+
 `<section class="panel"><div class="panel-head"><h3>إضافة طالب</h3><span class="badge blue">للمسؤول</span></div><form id="studentForm"><div class="form-grid"><div class="form-field"><label for="newStudentId">الرقم الجامعي</label><input id="newStudentId" class="field" required placeholder="مثال: 4400001"></div><div class="form-field"><label for="newStudentName">اسم الطالب</label><input id="newStudentName" class="field" required placeholder="الاسم الكامل"></div><div class="form-field"><label for="newStudentEmail">البريد الجامعي</label><input id="newStudentEmail" class="field" required placeholder="student@university.edu"></div><div class="form-field"><label for="newStudentCourse">المقرر</label><select id="newStudentCourse" class="field">${state.courses.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}</select></div></div><div class="form-actions"><button type="submit" class="primary">حفظ بيانات الطالب</button></div></form></section><section class="panel"><div class="panel-head"><h3>بيانات الطلاب</h3><span class="muted">${state.students.length} سجلات</span></div><div class="table-wrap"><table><thead><tr><th>الرقم الجامعي</th><th>اسم الطالب</th><th>البريد</th><th>المقرر</th><th>إجراء</th></tr></thead><tbody>${state.students.map(s=>`<tr><td>${esc(s.id)}</td><td>${esc(s.name)}</td><td>${esc(s.email)}</td><td>${esc(s.course||'—')}</td><td><button class="table-action" data-remove-student="${esc(s.id)}">حذف</button></td></tr>`).join('')}</tbody></table></div></section>`;
}
function pageSettings(){return pageHead('إعدادات النظام','ضبط حد الغياب وتشغيل التنبيهات وفق اللوائح المعتمدة من الجامعة.')+`<section class="panel"><h3>التنبيهات وحد الغياب</h3><form id="settingsForm" style="max-width:620px;margin-top:18px"><div class="form-grid"><div class="form-field"><label for="threshold">حد الغياب (%)</label><input id="threshold" type="number" min="1" max="100" value="${Number(state.threshold)}" class="field" required><div class="small">تعادل ${maxAbs()} غيابات، والحرمان عند الغياب رقم ${maxAbs()+1}.</div></div><div class="form-field"><label for="semLectures">عدد محاضرات المقرر</label><input id="semLectures" type="number" min="1" max="200" value="${Number(state.semesterLectures)}" class="field" required></div><div class="form-field"><label for="alertsEnabled">التنبيهات</label><select id="alertsEnabled" class="field"><option value="true" ${state.alertsEnabled?'selected':''}>مفعلة</option><option value="false" ${!state.alertsEnabled?'selected':''}>معطلة</option></select></div></div><div class="form-actions"><button type="submit" class="primary">حفظ الإعدادات</button></div></form></section>`}
function renderPage(){
 const pages={home:()=>currentRole==='student'?homeStudent():currentRole==='instructor'?homeInstructor():homeAdmin(),attendance:pageAttendance,courses:pageCourses,alerts:pageAlerts,session:pageSession,reports:pageReports,management:pageManagement,settings:pageSettings};
 $('content').innerHTML=(pages[currentPage]||pages.home)();
 bindPageEvents();
}
function goto(page){currentPage=page;renderNav();renderPage();window.scrollTo({top:0,behavior:'smooth'})}
function bindPageEvents(){
 document.querySelectorAll('[data-goto]').forEach(b=>b.addEventListener('click',()=>goto(b.dataset.goto)));
 document.querySelectorAll('[data-start-course]').forEach(b=>b.addEventListener('click',()=>{goto('session');setTimeout(()=>{const sel=$('sessionCourse');if(sel)sel.value=b.dataset.startCourse;},0)}));
 document.querySelectorAll('[data-edit-attendance]').forEach(b=>b.addEventListener('click',()=>{
  const [studentId,courseId,lecture]=b.dataset.editAttendance.split('|');const item=state.attendance.find(a=>a.studentId===studentId&&a.courseId===courseId&&a.lecture===lecture);if(!item)return;
  const status=prompt('أدخل الحالة الجديدة: حاضر أو غائب أو معذور',item.status);if(['حاضر','غائب','معذور'].includes(status)){item.status=status;persist();renderPage();showToast('تم تحديث حالة الحضور.')}else if(status!==null)showToast('الحالة غير معتمدة. استخدم: حاضر أو غائب أو معذور.');
 }));
 document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>handleAction(b.dataset.action)));
 document.querySelectorAll('[data-remove-student]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.removeStudent;if(!confirm('هل تريد حذف هذا الطالب؟'))return;state.students=state.students.filter(s=>s.id!==id);state.attendance=state.attendance.filter(a=>a.studentId!==id);persist();renderPage();showToast('تم حذف الطالب.')}));
 const sf=$('studentForm');if(sf)sf.addEventListener('submit',e=>{e.preventDefault();const id=$('newStudentId').value.trim(),name=$('newStudentName').value.trim(),email=$('newStudentEmail').value.trim(),course=$('newStudentCourse').value;if(!id||!name||!email){showToast('يرجى إكمال الحقول المطلوبة.');return}if(state.students.some(s=>s.id===id)){showToast('الرقم الجامعي مستخدم بالفعل.');return}state.students.push({id,name,email,course});persist();renderPage();showToast('تم حفظ بيانات الطالب.')} );
 const settings=$('settingsForm');if(settings)settings.addEventListener('submit',e=>{e.preventDefault();const n=Number($('threshold').value);if(!Number.isFinite(n)||n<1||n>100){showToast('أدخل نسبة بين 1 و100.');return}const L=Number($('semLectures').value);if(!Number.isInteger(L)||L<1){showToast('أدخل عدد محاضرات صحيحًا.');return}state.threshold=n;state.semesterLectures=L;state.alertsEnabled=$('alertsEnabled').value==='true';persist();renderPage();showToast('تم حفظ الإعدادات.')} );
}
function handleAction(action){
 if(action==='open-session'){$('sessionMessage').innerHTML='<span class="badge green">الجلسة مفتوحة</span> يمكنك الآن مراجعة الحالات ثم حفظها.';$('qrCode').textContent='482731';showToast('تم فتح جلسة التحضير.');}
 else if(action==='save-session'){
  const courseId=$('sessionCourse')?.value||'IS321',lecture=$('sessionLecture')?.value.trim()||'المحاضرة 11';const date=new Date().toISOString().slice(0,10);
  document.querySelectorAll('.roster-status').forEach(sel=>{const studentId=sel.dataset.student;const existing=state.attendance.find(a=>a.studentId===studentId&&a.courseId===courseId&&a.lecture===lecture);if(existing)existing.status=sel.value;else state.attendance.push({studentId,courseId,lecture,date,status:sel.value});});persist();renderPage();showToast('تم حفظ حالات الحضور.');
 }else if(action==='submit-qr'){
  if($('qrInput').value.trim()!=='482731'){showToast('رمز الجلسة غير صحيح. تحقق من الرمز وحاول مجددًا.');return}const courseId=$('studentCourse').value,me=getStudent().id,lecture='جلسة QR',date=new Date().toISOString().slice(0,10);const existing=state.attendance.find(a=>a.studentId===me&&a.courseId===courseId&&a.lecture===lecture);if(existing)existing.status='حاضر';else state.attendance.push({studentId:me,courseId,lecture,date,status:'حاضر'});persist();showToast('تم تسجيل الحضور بنجاح.');goto('attendance');
 }else if(action==='export-report')exportCSV();else if(action==='add-course'){
  const id=prompt('رمز المقرر الجديد (مثال IS350):');if(!id)return;const name=prompt('اسم المقرر:');if(!name)return;if(state.courses.some(c=>c.id===id)){showToast('رمز المقرر موجود بالفعل.');return}state.courses.push({id:id.trim(),name:name.trim(),section:'شعبة 1',instructor:'حسام الفحل',lectures:0,absent:0});persist();renderPage();showToast('تمت إضافة المقرر.');
 }
}
function exportCSV(){
 const header=['الرقم الجامعي','اسم الطالب','رمز المقرر','المقرر','المحاضرة','التاريخ','الحالة'];const lines=[header,...state.attendance.map(a=>{const s=state.students.find(x=>x.id===a.studentId)||{id:a.studentId,name:''};const c=state.courses.find(x=>x.id===a.courseId)||{name:a.courseId};return [s.id,s.name,a.courseId,c.name,a.lecture,a.date,a.status]})];const csv='\uFEFF'+lines.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));const a=document.createElement('a');a.href=url;a.download='تقرير_الحضور_والغياب.csv';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);showToast('تم تنزيل تقرير الحضور والغياب.');
}

</script>
</body>
